[program:webhook-deploy]
command=/bin/bash -c "set -a; source /home/deploy/webhook-deploy/.env; exec /home/deploy/webhook-deploy/webhook-deploy-bin"
directory=/home/deploy/webhook-deploy
user=deploy
autostart=true
autorestart=true
startretries=5
stdout_logfile=/var/log/webhook-deploy/webhook-deploy.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
redirect_stderr=true
